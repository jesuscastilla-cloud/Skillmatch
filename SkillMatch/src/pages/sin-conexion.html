<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - SkillMatch Cartagena</title>
    <meta name="description" content="No hay conexión a internet.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/img/favicon/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#EDF2F8">
    <link rel="stylesheet" href="../assets/css/app.css">
    <script>(function(){var t=localStorage.getItem('skillmatch_theme');if(t!=='dark'&&t!=='light'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);var l=localStorage.getItem('skillmatch_letra');if(l==='grande'||l==='muy-grande')document.documentElement.setAttribute('data-letra',l);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0B1B2C':'#EDF2F8');addEventListener('pagereveal',function(e){var v=e.viewTransition,d;try{d=JSON.parse(sessionStorage.getItem('skillmatch_deslizar'));sessionStorage.removeItem('skillmatch_deslizar');}catch(x){}if(d&&d.a===location.pathname&&Date.now()-d.t<15000){if(v&&v.types)v.types.add('ir-'+d.dir);var h=document.documentElement,c='entra-'+d.dir;h.classList.add(c);setTimeout(function(){h.classList.remove(c);},1400);}});})();</script>
</head>
<body>
    <!-- La muestra el service worker (sw.js) cuando no hay internet y esta pagina
         no tiene copia guardada. Sin ui.js ni fuentes de Google: todo lo que usa
         ya esta guardado en el dispositivo. -->
    <main id="main" class="sin-conexion">
        <img class="sin-conexion-logo" src="../assets/img/logo.png" alt="SkillMatch" width="531" height="160">
        <h1>Sin conexión</h1>
        <p class="lede">No hay internet en este momento. Cuando vuelva, esta página se recarga sola. Las páginas que ya abriste
           se pueden ver, pero las vacantes, los mensajes y tu perfil necesitan conexión para estar al día.</p>
        <button type="button" class="btn btn-primary" id="reintentar">Intentar de nuevo</button>
    </main>
    <script>
        (function () {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.querySelector('.sin-conexion-logo').src = '../assets/img/logo-oscuro.png';
            }
            document.getElementById('reintentar').addEventListener('click', function () { location.reload(); });
            window.addEventListener('online', function () { location.reload(); });
        })();
    </script>
</body>
</html>
