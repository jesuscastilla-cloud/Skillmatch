# ============================================================
#  SkillMatch - Configuracion base
#  Todo lo sensible o dependiente del entorno se lee de
#  variables de entorno, con un valor por defecto para local.
# ============================================================

spring.application.name=skillmatch-backend

# ---------- Servidor ----------
# Railway / Render / Fly inyectan PORT automaticamente.
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Necesario para que la app respete X-Forwarded-Proto detras del proxy del hosting
server.forward-headers-strategy=framework
# Los errores de Spring no muestran su mensaje interno (nombres de clases, campos)
server.error.include-message=never

# ---------- MongoDB ----------
# Acepta cualquiera de estos nombres de variable (el primero que exista gana):
#   MONGODB_URI  -> el estandar de MongoDB Atlas
#   MONGO_URL / MONGODB_URL -> el que inyecta el plugin de Mongo de Railway
#   SPRING_DATA_MONGODB_URI -> el nombre nativo de Spring
# La base de datos va DENTRO de la URI (.../skillmatch?retryWrites=true...)
spring.data.mongodb.uri=${MONGODB_URI:${MONGO_URL:${MONGODB_URL:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/skillmatch}}}}
spring.data.mongodb.auto-index-creation=false
# Representacion estandar de UUID
spring.data.mongodb.uuid-representation=standard

# ---------- JWT ----------
# JWT_SECRET es OBLIGATORIO (tambien en local): minimo 32 caracteres.
# Sin valor por defecto a proposito: uno escrito aqui seria publico y
# cualquiera podria firmar tokens. start.ps1 / start.sh definen una local.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Cookie de sesion ----------
# Secure se activa solo cuando la peticion llega por HTTPS (Render siempre).
# COOKIE_SECURE=true lo fuerza siempre. SameSite=None solo si el frontend
# estuviera en OTRO dominio (y entonces ALLOWED_ORIGINS con el dominio exacto).
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ---------- CORS ----------
# Lista separada por comas. En produccion el frontend va en el mismo dominio
# que la API. Usa SIEMPRE dominios exactos: un comodin como
# https://*.onrender.com autoriza paginas de cualquier persona.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://skillmatch-yz37.onrender.com}

# ---------- Rate limiting en /auth ----------
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.max-requests=${RATE_LIMIT_MAX:20}
# Cuantos proxies propios hay delante (Render: 1). La IP real se toma contando
# desde el final de X-Forwarded-For; lo del principio lo escribe el visitante.
# 0 = ignorar la cabecera y usar la IP de la conexion (sin proxy).
app.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:1}

# ---------- Correo (SMTP; hoy Gmail del proyecto) ----------
# Sin MAIL_USERNAME / MAIL_PASSWORD no se envia nada (ver CorreoService).
# Gmail (gratis, ~500 al dia): en la cuenta del proyecto activar la verificacion en
# dos pasos y crear una "contrasena de aplicacion" (myaccount.google.com/apppasswords).
#   MAIL_USERNAME = el Gmail, MAIL_PASSWORD = esa clave (16 letras, sin espacios),
#   MAIL_FROM = SkillMatch <el mismo Gmail> (Gmail no deja enviar a nombre de otro).
# Brevo u otro proveedor: cambiar MAIL_HOST; Brevo exige un dominio propio para el remitente.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.correo.remitente=${MAIL_FROM:SkillMatch <no-responder@skillmatch.local>}
# Consultar el DNS para saber si el dominio del correo recibe mensajes (ValidadorCorreo)
app.correo.verificar-dominio=${CORREO_VERIFICAR_DOMINIO:true}
# true SOLO en local: sin correo configurado, el correo (con el codigo) se escribe en el log
app.correo.modo-prueba=${CORREO_MODO_PRUEBA:false}

# ---------- Datos personales (Ley 1581) ----------
# Version de la politica que muestra politica-datos.html. Al cambiar la politica,
# cambiar aqui y en la pagina.
app.privacidad.version-politica=${PRIVACIDAD_VERSION_POLITICA:0.1}
# true cuando el frontend envie aceptaPolitica / mayorDeEdad en el registro
# (docs/CAMBIOS-FRONTEND.md, F6). Con false, el registro no lo exige.
app.privacidad.exigir-consentimiento=${PRIVACIDAD_EXIGIR_CONSENTIMIENTO:false}

# ---------- Telefono: codigos por SMS o WhatsApp (Twilio, de pago) ----------
# Sin estas variables no se envia nada (ver MensajeTelefonoService).
app.telefono.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.telefono.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.telefono.twilio.from=${TWILIO_FROM:}
app.telefono.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}
# sms o whatsapp: por cual canal se envian los codigos
app.telefono.canal=${TELEFONO_CANAL:sms}
# true: registro y entrada con el celular y un codigo (necesita Twilio o el modo
# prueba). false hasta que haya proveedor y el frontend (docs/CAMBIOS-FRONTEND.md, F12).
app.telefono.habilitado=${TELEFONO_HABILITADO:false}
# true SOLO en local: sin Twilio, el mensaje (con el codigo) se escribe en el log
app.telefono.modo-prueba=${SMS_MODO_PRUEBA:false}

# ---------- Entrar con Google (OAuth2 / OpenID Connect) ----------
# Apagado mientras falte alguna de las dos. Se sacan en Google Cloud Console >
# APIs y servicios > Credenciales > "ID de cliente de OAuth" (aplicacion web).
# URI de redireccion autorizada: https://<dominio>/login/oauth2/code/google
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Pagina a la que vuelve la persona con #google=<codigo> o #google-error=<motivo>.
# En local con Live Server: la URL completa de login.html en el puerto 5500.
app.google.pagina-retorno=${GOOGLE_PAGINA_RETORNO:/pages/login.html}
# La sesion del servidor (JSESSIONID) solo recuerda, mientras la persona esta en
# Google, el "state" de seguridad. La sesion real sigue siendo el JWT.
server.servlet.session.timeout=10m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Los navegadores aceptan cookies Secure tambien en http://localhost
server.servlet.session.cookie.secure=${SESION_COOKIE_SEGURA:true}

# ---------- Registro con codigo por correo ----------
# true: el registro envia un codigo y la cuenta se crea al confirmarlo (sin cuentas
# a medias). false hasta que el frontend tenga la pantalla del codigo
# (docs/CAMBIOS-FRONTEND.md, F10). Necesita el correo configurado.
app.registro.verificar-correo=${REGISTRO_VERIFICAR_CORREO:false}

# ---------- Seed de datos de prueba ----------
# OFF por defecto: activalo solo cuando quieras poblar una BD vacia.
skillmatch.seed.enabled=${SEED_ENABLED:false}
skillmatch.seed.users=${SEED_USERS:150}
skillmatch.seed.companies=${SEED_COMPANIES:40}
skillmatch.seed.jobs=${SEED_JOBS:120}
skillmatch.seed.applications=${SEED_APPLICATIONS:300}

# ---------- Archivos estaticos (frontend servido por el backend) ----------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ---------- SpringDoc / Swagger ----------
# Apagado por defecto: publica el mapa completo de la API.
# En local: SWAGGER_ENABLED=true (start.ps1 / start.sh ya lo ponen).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.override-with-generic-response=false
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Logging ----------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.skillmatch.backend=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.mongodb.driver=WARN
